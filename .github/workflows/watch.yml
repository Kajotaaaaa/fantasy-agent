name: fantasy-watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_flip_buy:
        description: "Forzar ahora la compra diaria del flipeo (necesita FLIP_MODE=on o shadow)"
        type: boolean
        default: false

concurrency:
  group: fantasy-watch
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar estado (sesión + dedupe de alertas)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: fantasy-state-${{ github.run_id }}
          restore-keys: |
            fantasy-state-

      - name: Sembrar sesión inicial si no hay caché todavía
        run: |
          mkdir -p data
          if [ ! -s data/tokens.json ] && [ -n "$FANTASY_TOKENS_JSON" ]; then
            echo "$FANTASY_TOKENS_JSON" > data/tokens.json
          fi
        env:
          FANTASY_TOKENS_JSON: ${{ secrets.FANTASY_TOKENS_JSON }}

      - name: fantasy tick
        run: python -m fantasy_agent tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FANTASY_LEAGUE_ID: ${{ secrets.FANTASY_LEAGUE_ID }}
          FANTASY_TEAM_ID: ${{ secrets.FANTASY_TEAM_ID }}
          # Interruptor del flipeo autónomo: variable del repositorio (Settings > Secrets and
          # variables > Actions > Variables). "on" ejecuta, "shadow" solo cuenta, vacío = apagado.
          FLIP_MODE: ${{ vars.FLIP_MODE }}
          # Freno del flipeo: cambiar el valor de FLIP_RESUME reanuda la compra tras una pausa;
          # FLIP_MAX_LOSS_M = millones perdidos en 14 días que la activan (5 por defecto).
          FLIP_RESUME: ${{ vars.FLIP_RESUME }}
          FLIP_MAX_LOSS_M: ${{ vars.FLIP_MAX_LOSS_M }}
          FLIP_FORCE_BUY: ${{ inputs.force_flip_buy && '1' || '' }}

      - name: Guardar estado actualizado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: fantasy-state-${{ github.run_id }}
