name = "fantasy-agent-telegram"
main = "telegram-webhook.js"
compatibility_date = "2025-01-01"

# El disparo de "fantasy-snipe" (rebaja de último segundo) YA NO va por un cron de hora fija
# (2026-09-23, arreglo del problema del horario de mercado: asumía las 21:00 para todas las
# ligas). Ahora lo arma dinámicamente el propio `tick` de GitHub Actions (cada 30 min, ve
# `expirationDate` real de los anuncios) en cuanto detecta que el próximo cierre está cerca —
# ver `cli._dispatch_repo_event`. Quedan dos crons: cada hora al minuto 13, comprobación de que
# el vigilante sigue vivo (telegram-webhook.js, healthCheck); y cada 10 min, un ping al panel web
# de Render para que no se duerma y pierda la sesión (keepPanelAwake, 2026-09-30).
[triggers]
crons = ["13 * * * *", "*/10 * * * *"]
